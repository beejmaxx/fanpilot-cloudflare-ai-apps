name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rally:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.8.2
          cache: npm
      - run: npm ci
      - run: npm run test:rally
      - run: npm run build:rally
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:rally
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rally-playwright-results
          path: |
            apps/rally/playwright-report
            apps/rally/test-results
          if-no-files-found: ignore
          retention-days: 7
